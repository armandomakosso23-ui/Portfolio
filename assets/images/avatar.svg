<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="Logo Armando Makosso - fenêtre de code AM">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a2e"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- carte fenêtre de code -->
  <rect x="14" y="14" width="272" height="272" rx="40" fill="url(#card)"
        stroke="url(#accent)" stroke-width="2.5"/>

  <!-- barre de titre + pastilles -->
  <g>
    <circle cx="52" cy="58" r="9" fill="#ff5f56"/>
    <circle cx="82" cy="58" r="9" fill="#ffbd2e"/>
    <circle cx="112" cy="58" r="9" fill="#27c93f"/>
  </g>
  <line x1="34" y1="86" x2="266" y2="86" stroke="#1e293b" stroke-width="2"/>

  <!-- monogramme AM -->
  <text x="150" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="120"
        font-weight="800" text-anchor="middle" dominant-baseline="central"
        fill="url(#accent)" filter="url(#soft)">AM</text>

  <!-- ligne de code décorative -->
  <text x="150" y="242" font-family="monospace" font-size="24" letter-spacing="3"
        text-anchor="middle" fill="#93c5fd" opacity="0.9">&lt;dev/&gt;</text>
</svg>
