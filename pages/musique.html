    <section>
        <h3>Musique</h3>
        <p style="margin-bottom: 24px; max-width: 720px;">
            En dehors du code, la musique fait partie de mon quotidien. Écoute ma playlist
            directement ci-dessous. 🎧
        </p>

        <h4 style="margin-bottom: 12px; color: #1db954;">Mes pochettes</h4>
        <div id="covers" class="covers-grid"></div>

        <!-- LECTEUR SPOTIFY INTÉGRÉ (joue directement dans la page) -->
        <div class="spotify-embed">
            <iframe src="https://open.spotify.com/embed/playlist/4MmAVuJWPCE8qKFXSuEfhm?utm_source=generator&theme=0"
                    height="420"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"
                    title="Playlist Spotify d'Armando Makosso"></iframe>
        </div>

        <a href="../accueil.html" class="back-btn">← Retour</a>
    </section>

    <footer>© 2026 – Armando Makosso</footer>

    <!-- Génère des pochettes colorées aléatoires -->
    <script>
      (function () {
        var grid = document.getElementById("covers");
        if (!grid) return;
        var notes = ["🎵", "🎧", "🎶", "🎤", "🎸", "🥁", "🎹", "🎷"];
        for (var i = 0; i < 8; i++) {
          var h1 = Math.floor(Math.random() * 360);
          var h2 = (h1 + 40 + Math.floor(Math.random() * 80)) % 360;
          var tile = document.createElement("div");
          tile.className = "cover";
          tile.style.background =
            "linear-gradient(135deg, hsl(" + h1 + ",70%,48%), hsl(" + h2 + ",65%,28%))";
          tile.innerHTML =
            '<span class="cover-note">' + notes[i % notes.length] +
            '</span><span class="cover-label">Titre ' + (i + 1) + "</span>";
          grid.appendChild(tile);
        }
      })();
    </script>

    <script src="../animations.js"></script>
