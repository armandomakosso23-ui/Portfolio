<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musique – Armando Makosso</title>
    <meta name="description" content="La musique d'Armando Makosso : découvrez ses sons préférés sur Spotify.">
    <meta name="author" content="Armando Makosso">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Musique – Armando Makosso">
    <meta property="og:image" content="../assets/images/avatar.svg">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../style.css">
</head>

<body class="music-page">

    <nav>
        <ul>
            <li><a href="../accueil.html">Accueil</a></li>
            <li><a href="apropos.html">À propos</a></li>
            <li><a href="competences.html">Compétences</a></li>
            <li><a href="experiences.html">Expériences</a></li>
            <li><a href="projets.html">Projets</a></li>
            <li><a href="veille.html">Veille</a></li>
            <li><a href="situations.html">Situations</a></li>
            <li><a href="musique.html" class="active" aria-current="page">Musique</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section>
        <h3>Musique</h3>
        <p style="margin-bottom: 24px; max-width: 720px;">
            En dehors du code, la musique fait partie de mon quotidien. Écoute ma playlist
            directement ci-dessous. 🎧
        </p>

        <h4 style="margin-bottom: 12px; color: #1db954;">Mes pochettes</h4>
        <div class="covers-grid">
            <img class="cover-img" src="../assets/images/cover-1.svg" alt="Pochette Minuit" loading="lazy">
            <img class="cover-img" src="../assets/images/cover-2.svg" alt="Pochette Skyline" loading="lazy">
            <img class="cover-img" src="../assets/images/cover-3.svg" alt="Pochette Néon" loading="lazy">
            <img class="cover-img" src="../assets/images/cover-4.svg" alt="Pochette Fréquences" loading="lazy">
            <img class="cover-img" src="../assets/images/cover-5.svg" alt="Pochette Cosmos" loading="lazy">
            <img class="cover-img" src="../assets/images/cover-6.svg" alt="Pochette Prisme" loading="lazy">
        </div>

        <h4 style="margin: 8px 0 12px; color: #1db954;">Mes titres</h4>
        <div id="tracklist" class="tracklist"></div>

        <!-- LECTEUR SPOTIFY INTÉGRÉ (joue directement dans la page) -->
        <div class="spotify-embed">
            <iframe src="https://open.spotify.com/embed/playlist/4MmAVuJWPCE8qKFXSuEfhm?utm_source=generator&theme=0"
                    height="420"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                    loading="lazy"
                    title="Playlist Spotify d'Armando Makosso"></iframe>
        </div>

        <a href="../accueil.html" class="back-btn">← Retour</a>
    </section>

    <footer>© 2026 – Armando Makosso</footer>

    <!-- Liste des titres avec une pochette (aléatoire) à côté de chacun -->
    <script>
      (function () {
        var list = document.getElementById("tracklist");
        if (!list) return;
        var songs = [
          { t: "Evicted", a: "Nemzzz" },
          { t: "8PM", a: "Nemzzz" },
          { t: "Us vs Them", a: "Nemzzz" },
          { t: "Redemption (feat. Nemzzz)", a: "Kidwild, Nemzzz" },
          { t: "PTSD", a: "Nemzzz" },
          { t: "Be Honest", a: "Jorja Smith, Burna Boy" },
          { t: "Not You", a: "Lil Mosey" },
          { t: "Call", a: "Lil Mosey" }
        ];
        var covers = [
          "cover-1.svg", "cover-2.svg", "cover-3.svg",
          "cover-4.svg", "cover-5.svg", "cover-6.svg"
        ];
        songs.forEach(function (s) {
          var cover = covers[Math.floor(Math.random() * covers.length)];
          var row = document.createElement("div");
          row.className = "track";
          row.innerHTML =
            '<img class="track-cover" src="../assets/images/' + cover + '" alt="">' +
            '<div class="track-info"><span class="track-title">' + s.t +
            '</span><span class="track-artist">' + s.a + "</span></div>";
          list.appendChild(row);
        });
      })();
    </script>

    <script src="../animations.js"></script>
</body>
</html>
