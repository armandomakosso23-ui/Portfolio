        <!-- FORMULAIRE DE CONTACT -->
        <!--
          Ce formulaire ouvre le logiciel de messagerie du visiteur (mailto).
          Pour recevoir les messages directement (sans app mail), créez un compte
          gratuit sur https://formspree.io puis remplacez la ligne "action" par :
          action="https://formspree.io/f/VOTRE_ID" method="POST"
          et supprimez enctype="text/plain".
        -->
        <form class="contact-form"
              action="mailto:armandomakosso23@gmail.com"
              method="POST"
              enctype="text/plain">
            <label for="cf-name">Nom</label>
            <input id="cf-name" type="text" name="nom" placeholder="Votre nom" required>

            <label for="cf-email">Email</label>
            <input id="cf-email" type="email" name="email" placeholder="vous@exemple.com" required>

            <label for="cf-message">Message</label>
            <textarea id="cf-message" name="message" rows="5" placeholder="Votre message..." required></textarea>

            <button type="submit" class="cv-btn">Envoyer</button>
        </form>
